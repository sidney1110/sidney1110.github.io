<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VICTOR+ 得勝者適性測驗</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 以解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 selection:bg-pink-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        /* --- 必備 SVG 圖示 --- */
        const IconPhone = ({ size, color }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>;
        const IconUserCheck = ({ size, color }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>;
        const IconGradCap = ({ size, color }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>;
        const IconBuilding = ({ size, color }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>;
        const IconBrain = ({ size, color }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"></path></svg>;
        const IconRefresh = ({ size, color }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;
        const IconExternalLink = ({ size, color }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>;

        /* --- 測驗核心組件 --- */
        const InteractiveQuiz = ({ theme }) => {
            const [step, setStep] = useState(0);
            const [results, setResults] = useState([]);

            // 處理分支邏輯 (依照 PDF 架構)
            const handleAnswer = (q, isYes) => {
                if (q === 1) {
                    if (isYes) {
                        setStep(1); // 進入下一題
                    } else {
                        // 否 -> 教務
                        setResults([{ 
                            title: '教務', 
                            desc: '邏輯緊密排成大師', 
                            icon: <IconBuilding size={40} color={theme.primary} />,
                            link: 'https://www.104.com.tw/job/8zek8?jobsource=company_job'
                        }]);
                        setStep(2);
                    }
                } else if (q === 2) {
                    if (isYes) {
                        // 是 -> 櫃台 / 課程行銷人員
                        setResults([
                            { 
                                title: '行政櫃台', 
                                desc: '耐心傾聽與引導', 
                                icon: <IconUserCheck size={40} color={theme.primary} />,
                                link: 'https://www.104.com.tw/job/8nhhp?jobsource=company_job'
                            },
                            { 
                                title: '課程行銷人員', 
                                desc: '職涯挑戰與回饋', 
                                icon: <IconGradCap size={40} color={theme.primary} />,
                                link: 'https://www.104.com.tw/job/72myk?jobsource=company_job' 
                            }
                        ]);
                    } else {
                        // 否 -> 導師 / 網路部導師
                        setResults([
                            { 
                                title: '導師', 
                                desc: '溫暖與控班氣場', 
                                icon: <IconUserCheck size={40} color={theme.primary} />,
                                link: 'https://www.104.com.tw/job/80jj8?jobsource=company_job'
                            },
                            { 
                                title: '網路部導師', 
                                desc: '數位效率與洞察力', 
                                icon: <IconPhone size={40} color={theme.primary} />,
                                link: 'https://www.104.com.tw/job/8u7sj?jobsource=company_job'
                            }
                        ]);
                    }
                    setStep(2);
                }
            };

            const reset = () => { setStep(0); setResults([]); };

            // 第一題
            if (step === 0) {
                return (
                    <div className="animate-in fade-in zoom-in duration-500 bg-white p-8 md:p-12 rounded-[2.5rem] border border-gray-100 shadow-2xl text-center max-w-2xl mx-auto">
                        <div className="inline-flex p-5 rounded-full bg-pink-50 mb-8">
                            <IconUserCheck size={56} color={theme.primary} />
                        </div>
                        <h3 className="text-3xl md:text-4xl font-black mb-10" style={{ color: theme.textDark }}>您喜歡與人接觸嗎？</h3>
                        <div className="flex flex-col sm:flex-row gap-6 justify-center">
                            <button onClick={() => handleAnswer(1, true)} className="flex-1 py-5 px-8 rounded-2xl text-xl font-bold text-white transition-transform hover:scale-105 shadow-xl hover:shadow-2xl" style={{ backgroundColor: theme.primary }}>
                                👍 是，很喜歡
                            </button>
                            <button onClick={() => handleAnswer(1, false)} className="flex-1 py-5 px-8 rounded-2xl text-xl font-bold text-gray-600 bg-gray-100 transition-transform hover:scale-105 hover:bg-gray-200 shadow-md hover:shadow-lg">
                                🙅 否，較不傾向
                            </button>
                        </div>
                    </div>
                );
            }

            // 第二題
            if (step === 1) {
                return (
                    <div className="animate-in fade-in zoom-in duration-500 bg-white p-8 md:p-12 rounded-[2.5rem] border border-gray-100 shadow-2xl text-center max-w-2xl mx-auto">
                        <div className="inline-flex p-5 rounded-full bg-pink-50 mb-8">
                            <IconBrain size={56} color={theme.primary} />
                        </div>
                        <h3 className="text-3xl md:text-4xl font-black mb-10" style={{ color: theme.textDark }}>您的個性屬於活潑外向嗎？</h3>
                        <div className="flex flex-col sm:flex-row gap-6 justify-center">
                            <button onClick={() => handleAnswer(2, true)} className="flex-1 py-5 px-8 rounded-2xl text-xl font-bold text-white transition-transform hover:scale-105 shadow-xl hover:shadow-2xl" style={{ backgroundColor: theme.primary }}>
                                🥳 是，我很活潑
                            </button>
                            <button onClick={() => handleAnswer(2, false)} className="flex-1 py-5 px-8 rounded-2xl text-xl font-bold text-gray-600 bg-gray-100 transition-transform hover:scale-105 hover:bg-gray-200 shadow-md hover:shadow-lg">
                                😌 否，偏向沉穩
                            </button>
                        </div>
                    </div>
                );
            }

            // 結果頁面
            return (
                <div className="animate-in fade-in slide-in-from-bottom-8 duration-700 text-center max-w-4xl mx-auto">
                    <h3 className="text-3xl font-black mb-10 text-gray-700">🎉 測驗結果：在得勝者，您最適合...</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 md:gap-8 mb-12 justify-center">
                        {results.map((res, i) => (
                            <div key={i} className={`bg-white p-8 md:p-10 rounded-[2.5rem] border-2 shadow-xl hover:shadow-2xl transition-shadow flex flex-col justify-between ${results.length === 1 ? 'sm:col-span-2 max-w-md mx-auto w-full' : ''}`} style={{ borderColor: theme.primary }}>
                                <div>
                                    <div className="flex justify-center mb-6">{res.icon}</div>
                                    <h4 className="text-3xl md:text-4xl font-black mb-4" style={{ color: theme.primary }}>{res.title}</h4>
                                    <p className="text-xl md:text-2xl text-gray-600 font-medium mb-8">{res.desc}</p>
                                </div>
                                
                                <a 
                                    href={res.link} 
                                    target="_blank" 
                                    rel="noopener noreferrer" 
                                    className="flex items-center justify-center gap-2 text-white px-6 py-4 rounded-xl font-bold text-lg shadow-md hover:opacity-90 active:scale-95 transition-all w-full mt-auto"
                                    style={{ backgroundColor: theme.primary }}
                                >
                                    了解職缺詳情 <IconExternalLink size={20} color="white" />
                                </a>
                            </div>
                        ))}
                    </div>
                    <button onClick={reset} className="inline-flex items-center gap-3 px-8 py-4 rounded-2xl font-bold text-lg text-gray-600 bg-gray-200 hover:bg-gray-300 transition-colors shadow-sm">
                        <IconRefresh size={24} color="#4b5563" /> 重新測驗
                    </button>
                </div>
            );
        };

        /* --- 主應用程式 --- */
        const App = () => {
            const theme = {
                primary: '#8B1D57',   /* VICTOR紫紅 */
                textDark: '#231F20',  /* 標題深灰黑 */
            };

            return (
                <div className="min-h-screen flex flex-col bg-gray-50">
                    {/* 獨立版專屬 Header */}
                    <header className="px-6 md:px-10 py-6 border-b bg-white shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center">
                            <span className="text-4xl font-black tracking-tighter leading-none" style={{ color: theme.textDark }}>VICT</span>
                            <div className="relative mx-1 w-8 h-8">
                                <div className="absolute inset-0 rounded-full border-[0.6rem] border-gray-500"></div>
                                <div className="absolute inset-0 rounded-full border-[0.6rem] border-transparent" style={{ borderTopColor: theme.primary, transform: 'rotate(45deg)' }}></div>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <div className="w-[110%] h-[3px] bg-white"></div>
                                    <div className="h-[110%] w-[3px] bg-white absolute"></div>
                                </div>
                            </div>
                            <span className="text-4xl font-black leading-none" style={{ color: theme.textDark }}>R</span>
                            <span className="text-3xl font-black leading-none ml-1 relative -top-2" style={{ color: theme.primary }}>+</span>
                            <span className="ml-4 font-bold text-gray-400 text-lg tracking-widest border-l-2 pl-4">職位適性測驗</span>
                        </div>
                    </header>

                    {/* 測驗內容區置中 */}
                    <main className="flex-grow flex items-center justify-center p-6 md:p-12 bg-gradient-to-b from-gray-50 to-gray-100">
                        <div className="w-full">
                            <InteractiveQuiz theme={theme} />
                        </div>
                    </main>

                    {/* 頁尾 */}
                    <footer className="text-center py-6 text-gray-400 font-medium text-sm">
                        © 2026 VICTOR+ 得勝者文教 | 找出屬於你的教學價值
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
